<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change PIN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen active">
<div class="card form-card">
  <h2>Change PIN</h2>
  <label>New PIN</label>
  <input id="new-pin" type="password" placeholder="Enter New PIN">
  <label>Confirm New PIN</label>
  <input id="new-pin-confirm" type="password" placeholder="Enter New PIN Again">
  <button onclick="changePin()">Change PIN</button>
  <a class="btn secondary" href="bank-menu.html">Back</a>
</div>
</main>

<!-- Secret PIN Masked & Strikethrough Modal ("Keep It Secret!!") -->
<div id="secret-pin-modal" class="secret-pin-modal hidden">
  <div class="secret-pin-backdrop" onclick="finishPinChange()"></div>
  <div class="secret-pin-card">
    <div class="secret-lock-icon">🔒</div>
    <div class="secret-security-badge">SECURITY ENCRYPTED</div>
    <h3 class="secret-title">Keep It Secret!!</h3>
    
    <!-- The PIN Bar with dots and animated censor strike-through -->
    <div class="secret-pin-bar-wrapper">
      <div class="secret-pin-bar" id="secret-pin-bar">
        <span class="secret-dot">●</span>
        <span class="secret-dot">●</span>
        <span class="secret-dot">●</span>
        <span class="secret-dot">●</span>
        <div class="censor-line-main"></div>
        <div class="censor-line-secondary"></div>
      </div>
    </div>

    <p class="secret-note">Your PIN has been updated and securely masked.</p>
    <button class="btn secret-continue-btn" onclick="finishPinChange()">Continue to Menu</button>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
