<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen active">
<div class="card form-card">
  <h2>Deposit</h2>
  <div class="amount-field-wrapper">
    <div class="flying-money-stage" id="flying-money-stage"></div>
    <label for="deposit-amount">Amount</label>
    <input id="deposit-amount" type="number" min="0" step="0.01" placeholder="Please Enter Your Amount">
  </div>
  <label>Credit Card Number</label>
  <div class="card-input-wrapper">
    <input id="deposit-card" inputmode="numeric" maxlength="19" placeholder="Please Enter The Card Number">
    <div id="card-brand-badge" class="card-brand-badge hidden">
      <span id="card-brand-icon"></span>
      <span id="card-brand-text"></span>
    </div>
  </div>
  <div class="card-details">

    <div class="input-group">
        <label>Expiration Date</label>
        <input id="deadline" inputmode="numeric" maxlength="5" placeholder="MM/YY" class="expire">
    </div>

    <div class="input-group">
        <label>CVV</label>
        <input id="cvv" inputmode="numeric" maxlength="3" placeholder="Please Enter The CVV" class="cvv">
    </div>

</div>
  <button onclick="deposit()">Deposit</button>
  <a class="btn secondary" href="bank-menu.html">Back</a>
</div>
</main>
<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
