<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen active">
<div class="card history-card">
  <div class="history-card-header">
    <h2>Transaction History</h2>
    <span class="history-count-tag" id="history-count-tag">0 Transactions</span>
  </div>
  <div id="history-list" class="history-list">
    <!-- Rendered dynamically with custom animated illustrations -->
  </div>
  <pre id="history-output" class="hidden"></pre>
  <button onclick="openHistory()">Refresh History</button>
  <a class="btn secondary" href="bank-menu.html">Back</a>
</div>
</main>
<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
