<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen active">
<div class="card form-card">
  <h2>Login</h2>
  <label>ID</label>
  <input id="login-id" type="text" placeholder="Please Enter Your ID">
  <label>PIN</label>
  <input id="login-pin" type="password" placeholder="Please Enter PIN">
  <button onclick="login()">Login</button>
  <a class="btn secondary" href="index.html">Back</a>
</div>
</main>
<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
